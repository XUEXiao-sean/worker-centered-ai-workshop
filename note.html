<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>完整研究笔记 | Worker-Centered AI Workshop</title>
  <meta name="description" content="从 Obsidian 导出的完整 Worker-Centered AI Workshop 研究笔记。">
  <link rel="stylesheet" href="styles.css">
  <style>
    .note-page {
      min-height: 100vh;
      background:
        radial-gradient(circle at 92% 4%, rgba(215, 193, 255, .52), transparent 20%),
        var(--paper);
    }

    .note-nav {
      max-width: 920px;
      margin: auto;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .note-nav a {
      font-size: .88rem;
      font-weight: 780;
      text-decoration: none;
    }

    .note-shell {
      max-width: 920px;
      margin: 0 auto;
      padding: 46px 24px 120px;
    }

    .note-header {
      margin-bottom: 46px;
      padding-bottom: 34px;
      border-bottom: 1px solid var(--line);
    }

    .note-header h1 {
      max-width: 840px;
      margin-bottom: 22px;
      font-size: clamp(2.5rem, 5.8vw, 5.3rem);
    }

    .note-header p {
      max-width: 700px;
      color: var(--muted);
    }

    .note-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
      margin-top: 28px;
    }

    .note-content {
      padding: clamp(26px, 5vw, 58px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 18px 50px rgba(38, 52, 48, .08);
    }

    .note-content h1 {
      margin: 0 0 34px;
      font-size: clamp(2rem, 4vw, 3.5rem);
      line-height: 1.08;
    }

    .note-content h2 {
      margin: 58px 0 18px;
      padding-top: 8px;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      letter-spacing: -.035em;
    }

    .note-content h3 {
      margin: 42px 0 14px;
      font-size: 1.45rem;
    }

    .note-content p,
    .note-content li {
      color: #394440;
      font-size: 1.02rem;
      line-height: 1.9;
    }

    .note-content p {
      margin-bottom: 1.35em;
    }

    .note-content ol,
    .note-content ul {
      margin: 0 0 1.5em;
      padding-left: 1.5em;
    }

    .note-content li {
      margin-bottom: .75em;
      padding-left: .25em;
    }

    .loading {
      color: var(--muted);
    }

    @media (max-width: 560px) {
      .note-nav {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body class="note-page">
  <nav class="note-nav">
    <a href="index.html">← Workshop Hub</a>
    <a href="workshop-note.md">查看原始 Markdown</a>
  </nav>

  <main class="note-shell">
    <header class="note-header">
      <p class="eyebrow">Full Obsidian export</p>
      <h1>完整研究笔记</h1>
      <p>
        此页面完整呈现 Obsidian 中的工作坊研究草稿。没有安装 Obsidian 或没有对应
        Vault 的共同作者也可以直接阅读。
      </p>
      <div class="note-actions">
        <a
          class="button primary"
          href="obsidian://open?vault=New&amp;file=%E5%8F%AA%E5%B8%AE%E8%81%8C%E5%B7%A5%E4%B8%8D%E5%B8%AE%E8%80%81%E6%9D%BF%E7%9A%84AI%E5%B7%A5%E5%85%B7%20%E8%AE%BE%E8%AE%A1%E5%B7%A5%E4%BD%9C%E5%9D%8A"
        >在 Obsidian 中打开</a>
        <a class="button" href="index.html">返回三个入口</a>
      </div>
    </header>

    <article class="note-content" id="note-content">
      <p class="loading">正在载入完整研究笔记…</p>
    </article>
  </main>

  <script>
    const escapeHtml = (value) => value
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");

    const inlineMarkdown = (value) => escapeHtml(value)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/`(.+?)`/g, "<code>$1</code>");

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r/g, "").split("\n");
      const output = [];
      let paragraph = [];
      let listType = null;
      let listItems = [];
      let inFrontmatter = lines[0] === "---";

      const flushParagraph = () => {
        if (paragraph.length) {
          output.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
          paragraph = [];
        }
      };

      const flushList = () => {
        if (listType && listItems.length) {
          output.push(`<${listType}>${listItems.map((item) => `<li>${inlineMarkdown(item)}</li>`).join("")}</${listType}>`);
        }
        listType = null;
        listItems = [];
      };

      for (let index = 0; index < lines.length; index += 1) {
        const line = lines[index].trim();

        if (inFrontmatter) {
          if (index > 0 && line === "---") inFrontmatter = false;
          continue;
        }

        if (!line) {
          flushParagraph();
          flushList();
          continue;
        }

        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        const unordered = line.match(/^[-*]\s+(.+)$/);
        const ordered = line.match(/^\d+\.\s+(.+)$/);

        if (heading) {
          flushParagraph();
          flushList();
          const level = heading[1].length;
          output.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
        } else if (unordered || ordered) {
          flushParagraph();
          const nextType = unordered ? "ul" : "ol";
          if (listType && listType !== nextType) flushList();
          listType = nextType;
          listItems.push((unordered || ordered)[1]);
        } else {
          flushList();
          paragraph.push(line);
        }
      }

      flushParagraph();
      flushList();
      return output.join("");
    }

    fetch("workshop-note.md")
      .then((response) => {
        if (!response.ok) throw new Error("Unable to load note");
        return response.text();
      })
      .then((markdown) => {
        document.getElementById("note-content").innerHTML = renderMarkdown(markdown);
      })
      .catch(() => {
        document.getElementById("note-content").innerHTML =
          '<p>笔记载入失败。请使用页面顶部的“查看原始 Markdown”。</p>';
      });
  </script>
</body>
</html>
